name: Barometer snapshot (daily forward)

# 매일 프리즈(메트릭 갱신) 이후 전 테마 바로미터를 스냅샷해 무편향 트랙레코드를 누적한다.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *" # daily 13:30 KST (UTC 04:30) — freeze/index rebuild 이후

permissions:
  contents: write

concurrency:
  group: barometer-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute barometer snapshot
        run: |
          set -e
          node scripts/barometer_snapshot.mjs

      - name: Commit & push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/barometer/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git pull --rebase --autostash -X theirs origin main || true
          git commit -m "chore(barometer): daily snapshot"
          git push
